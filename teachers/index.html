<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="../favicon.ico">
<title>Teacher Analytics — Don't Be Late!</title>
<meta name="description" content="See how your students are doing in Don't Be Late! with the Teacher Analytics dashboard.">
<style>
  body { opacity: 0; transition: opacity 0.15s ease; }
  body.ready { opacity: 1; }
</style>
<script>
  document.fonts.ready.then(function() {
    document.body.classList.add('ready');
  });
</script>
<style>
  @font-face {
    font-family: 'Fredoka One';
    src: url('../Fonts/FredokaOne-Regular.ttf') format('truetype');
    font-weight: 400;
    font-display: block;
  }
  @font-face {
    font-family: 'Plus Jakarta Sans';
    src: url('../Fonts/PlusJakartaSans-Regular.ttf') format('truetype');
    font-weight: 400;
    font-display: block;
  }
  @font-face {
    font-family: 'Plus Jakarta Sans';
    src: url('../Fonts/PlusJakartaSans-Medium.ttf') format('truetype');
    font-weight: 500;
    font-display: block;
  }
  @font-face {
    font-family: 'Plus Jakarta Sans';
    src: url('../Fonts/PlusJakartaSans-SemiBold.ttf') format('truetype');
    font-weight: 600;
    font-display: block;
  }
  @font-face {
    font-family: 'Plus Jakarta Sans';
    src: url('../Fonts/PlusJakartaSans-Bold.ttf') format('truetype');
    font-weight: 700;
    font-display: block;
  }
  @font-face {
    font-family: 'Plus Jakarta Sans';
    src: url('../Fonts/PlusJakartaSans-ExtraBold.ttf') format('truetype');
    font-weight: 800;
    font-display: block;
  }

  @font-face {
    font-family: 'Alphakind';
    src: url('../Fonts/Alphakind.ttf') format('truetype');
    font-weight: 400;
    font-display: block;
  }

  :root {
    --bg: #ffffff;
    --surface: #f7f8fc;
    --surface2: #eef0f7;
    --primary: #0197F6;
    --orange: #FFA552;
    --green: #0DB067;
    --blue: #2B7FFF;
    --pink: #E8198B;
    --white: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --border: rgba(0,0,0,0.08);
    --font-display: 'Fredoka One', cursive;
    --font-body: 'Plus Jakarta Sans', sans-serif;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .display { font-family: var(--font-display); }

  /* ── MATH BG ── */
  .math-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .math-symbol {
    position: absolute;
    font-family: var(--font-display);
    font-size: var(--size, 2rem);
    color: var(--sym-color, rgba(1,151,246,0.10));
    user-select: none;
    animation: floatSym var(--dur, 18s) ease-in-out infinite var(--delay, 0s);
    transform-origin: center;
  }
  @keyframes floatSym {
    0%   { transform: translateY(0px) rotate(var(--rot0, 0deg)); opacity: var(--op, 0.08); }
    33%  { transform: translateY(-22px) rotate(var(--rot1, 8deg)); opacity: calc(var(--op, 0.08) * 1.4); }
    66%  { transform: translateY(10px) rotate(var(--rot2, -5deg)); opacity: var(--op, 0.08); }
    100% { transform: translateY(0px) rotate(var(--rot0, 0deg)); opacity: var(--op, 0.08); }
  }

  /* ── NAV ── */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 1000;
    padding: 18px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(0,0,0,0.06);
  }

  /* ── MAIN ── */
  main {
    position: relative;
    z-index: 1;
    flex: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 140px 24px 120px;
    background: radial-gradient(ellipse 90% 90% at 50% 50%, rgba(1,151,246,0.12), rgba(255,255,255,0) 70%);
  }
  .error-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    justify-content: center;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 14px 30px;
    border-radius: 100px;
    font-weight: 800;
    font-size: 0.95rem;
    text-decoration: none;
    transition: transform 0.18s, box-shadow 0.18s;
  }
  .btn-primary {
    background: var(--primary);
    color: #fff;
    box-shadow: 0 10px 30px rgba(1,151,246,0.28);
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 40px rgba(1,151,246,0.38);
  }
  .btn-outline {
    background: transparent;
    color: var(--text);
    border: 2px solid var(--text);
  }
  .btn-outline:hover {
    border-color: var(--text);
    background: var(--surface);
  }


  /* ── FOOTER ── */
  footer {
    position: relative; z-index: 1;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 40px 24px 32px;
    text-align: center;
  }
  .footer-inner {
    max-width: 1060px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .footer-tagline {
    color: var(--muted);
    font-size: 0.85rem;
    font-weight: 500;
    margin-top: 10px;
  }
  .social-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }
  .social-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 9px 16px;
    border-radius: 100px;
    border: 1.5px solid var(--border);
    color: var(--muted);
    font-size: 0.8rem;
    font-weight: 700;
    text-decoration: none;
    transition: color 0.18s, border-color 0.18s, background 0.18s;
  }
  .social-btn:hover {
    color: var(--text);
    border-color: rgba(0,0,0,0.18);
    background: var(--white);
  }
  .footer-links {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .footer-links a {
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 600;
    text-decoration: none;
  }
  .footer-links a:hover { color: var(--text); }
  .footer-copy {
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 500;
  }

  /* ── NAV BACK ── */
  .nav-back {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--muted);
    text-decoration: none;
    padding: 8px 18px;
    border-radius: 100px;
    border: 1.5px solid var(--border);
    transition: color 0.18s, border-color 0.18s, background 0.18s;
  }
  .nav-back:hover {
    color: var(--text);
    border-color: rgba(0,0,0,0.18);
    background: var(--surface);
  }

  /* ── NAV ── */
  .nav-left {
    display: flex;
    align-items: center;
    gap: 24px;
  }
  .nav-links {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .nav-link {
    padding: 9px 14px;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--text);
    text-decoration: none;
    transition: background 0.18s, color 0.18s;
  }
  .nav-link:hover { background: var(--surface); }
  .nav-link[aria-current="page"] { color: #0170B8; background: rgba(1,151,246,0.10); }
  button.nav-link { background: none; border: 0; font-family: inherit; cursor: pointer; }
  .nav-item { position: relative; }
  .nav-item > .nav-link { display: inline-flex; align-items: center; gap: 6px; }
  .nav-caret { width: 10px; height: 10px; transition: transform 0.18s; }
  .nav-item:hover .nav-caret,
  .nav-links:not(:hover) .nav-item:has(:focus-visible) .nav-caret { transform: rotate(180deg); }
  /* Top padding bridges the gap between the link and the menu so hover isn't lost */
  .nav-dropdown {
    position: absolute;
    top: 100%;
    left: 0;
    padding-top: 10px;
    opacity: 0;
    visibility: hidden;
    transform: translateY(4px);
    transition: opacity 0.16s, transform 0.16s, visibility 0.16s;
    z-index: 1001;
  }
  .nav-item:hover .nav-dropdown,
  .nav-links:not(:hover) .nav-item:has(:focus-visible) .nav-dropdown {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }
  .nav-dropdown-menu {
    min-width: 220px;
    padding: 8px;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 16px 40px rgba(15,23,42,0.12);
  }
  .nav-dropdown-menu a {
    display: block;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 0.92rem;
    font-weight: 600;
    color: var(--text);
    text-decoration: none;
    white-space: nowrap;
  }
  .nav-dropdown-menu a:hover { background: var(--surface); color: #0170B8; }
  nav .btn { padding: 12px 26px; font-size: 0.92rem; }
  nav .btn-primary { box-shadow: none; }

  /* ── WEBGL PAGE ── */
  .page-title {
    font-size: 3.2rem;
    line-height: 1.1;
    margin-bottom: 14px;
  }
  .page-title em { font-style: normal; color: var(--primary); }
  .page-sub {
    color: var(--muted);
    font-size: 1.05rem;
    max-width: 560px;
    margin-bottom: 36px;
    line-height: 1.6;
  }
  html, body.play-page { height: 100%; overflow: hidden; background: #0f172a; }
  .game-shell {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: url('../play-loading-bg.jpg') center / cover no-repeat, #4FC3EA;
  }
  .game-shell canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    background: url('../play-loading-bg.jpg') center / cover no-repeat, #4FC3EA;
  }
  .game-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 24px;
    color: #fff;
    background: radial-gradient(ellipse 70% 70% at 50% 40%, rgba(1,151,246,0.25), rgba(15,23,42,0) 70%), #0f172a;
  }
  .game-placeholder .ph-title { font-family: var(--font-display); font-size: 1.7rem; }
  .game-placeholder .ph-sub { color: rgba(255,255,255,0.7); font-size: 0.95rem; max-width: 380px; line-height: 1.55; }
  .game-loading {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    color: #fff;
    background: url('../play-loading-bg.jpg') center / cover no-repeat, #4FC3EA;
  }
  .game-loading.show { display: flex; }
  .game-placeholder .ph-title,
  .game-loading .ph-title { font-family: 'Alphakind', var(--font-display); font-weight: 400; letter-spacing: 0.02em; }
  .game-loading .ph-title {
    font-size: 2.2rem;
    text-shadow: 0 3px 0 rgba(11,37,64,0.35), 0 6px 18px rgba(11,37,64,0.3);
  }
  .game-loading .progress-track {
    height: 14px;
    background: rgba(255,255,255,0.55);
    box-shadow: 0 0 0 3px #fff, 0 8px 20px rgba(11,37,64,0.2);
  }
  .game-loading .ph-sub { text-shadow: 0 2px 8px rgba(11,37,64,0.5); }
  .progress-track {
    width: min(320px, 70%);
    height: 10px;
    border-radius: 100px;
    background: rgba(255,255,255,0.12);
    overflow: hidden;
  }
  .progress-fill {
    width: 0%;
    height: 100%;
    border-radius: 100px;
    background: var(--primary);
    transition: width 0.2s;
  }
  .game-controls {
    margin-top: 18px;
    display: flex;
    gap: 12px;
    justify-content: center;
  }
  button.btn { font-family: var(--font-body); cursor: pointer; }
  .btn[disabled] { opacity: 0.45; pointer-events: none; }
  .feedback-form {
    margin-top: 56px;
    width: 100%;
    max-width: 640px;
    padding: 32px 28px;
    border-radius: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
  }
  .feedback-form h2 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 1.6rem;
    margin-bottom: 10px;
  }
  .feedback-form p {
    color: var(--muted);
    font-size: 0.98rem;
    line-height: 1.6;
    margin-bottom: 22px;
  }


  @media (max-width: 760px) {
    nav { padding: 12px 16px; }
    nav img { height: 40px !important; }
    .nav-left { gap: 6px; }
    .nav-links { gap: 0; }
    .nav-link { padding: 6px 8px; font-size: 0.8rem; }
    .nav-caret { display: none; }
    .nav-item-schools { display: none; }
    nav .btn { white-space: nowrap; }
    nav img { height: clamp(30px, 9.5vw, 40px) !important; }
    nav .btn { padding: 8px 12px; font-size: 0.78rem; }
    main { padding: 110px 16px 80px; }
    .page-title { font-size: 2.2rem; }
    .page-sub { font-size: 0.98rem; }
    .game-placeholder .ph-title { font-size: 1.3rem; }
    .game-placeholder .ph-sub { font-size: 0.85rem; }
  }

  /* ── SITE FOOTER ── */
  footer.site-footer {
    background: #ffffff;
    border-top: 1px solid rgba(0,0,0,0.08);
    padding: 0;
    font-family: 'Plus Jakarta Sans', sans-serif;
    text-align: left;
  }
  .sf-main {
    max-width: 1280px;
    margin: 0 auto;
    padding: 56px max(32px, 7vw) 48px;
    display: grid;
    grid-template-columns: 1.3fr repeat(2, 1fr);
    gap: 40px;
    align-items: start;
  }
  .sf-brand img.sf-logo { height: 44px; width: auto; display: block; }
  .sf-tagline { color: #64748b; font-size: 0.85rem; font-weight: 500; margin: 12px 0 18px; line-height: 1.5; }
  .sf-social { display: flex; gap: 14px; align-items: center; }
  .sf-social a { color: #94a3b8; display: inline-flex; transition: color 0.2s; }
  .sf-social a:hover { color: #0197F6; }
  .sf-social svg { width: 20px; height: 20px; }
  .sf-col h4 {
    font-size: 1rem;
    font-weight: 800;
    color: #0f172a;
    margin: 0 0 14px;
  }
  .sf-col a {
    display: block;
    color: #475569;
    font-size: 0.9rem;
    font-weight: 500;
    text-decoration: none;
    padding: 5px 0;
    transition: color 0.2s;
  }
  .sf-col a:hover { color: #0197F6; }
  .sf-bottom { background: #0B2540; }
  .sf-bottom-inner {
    max-width: 1280px;
    margin: 0 auto;
    padding: 18px max(32px, 7vw);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px 28px;
  }
  .sf-copy { color: rgba(255,255,255,0.7); font-size: 0.82rem; font-weight: 500; margin: 0; }
  .sf-legal { display: flex; flex-wrap: wrap; gap: 8px 28px; }
  .sf-legal a { color: #ffffff; font-size: 0.85rem; font-weight: 600; text-decoration: none; }
  .sf-legal a:hover { text-decoration: underline; }
  @media (max-width: 1000px) {
    .sf-main { grid-template-columns: repeat(2, 1fr); }
    .sf-brand { grid-column: 1 / -1; }
  }
  @media (max-width: 560px) {
    .sf-main { grid-template-columns: 1fr 1fr; gap: 32px 24px; padding: 44px 20px 36px; }
    .sf-bottom-inner { padding: 18px 20px; flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body class="play-page">

  <div class="game-shell" id="gameShell">
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <div class="game-placeholder" id="gamePlaceholder">
      <div class="ph-title">Coming soon</div>
      <p class="ph-sub">The browser version of the Teacher Analytics dashboard is on its way. Check back shortly!</p>
    </div>

    <div class="game-loading" id="gameLoading">
      <div class="ph-title display">Loading dashboard…</div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <p class="ph-sub"></p>
    </div>
  </div>

  <script>
    // Unity WebGL build settings. BUILD_NAME is the file prefix Unity generated
    // (e.g. "MyGame" for MyGame.loader.js); leave it empty to show the placeholder.
    // The build files are served from Cloudflare R2 because they exceed GitHub's
    // 100 MB file limit; the bucket's CORS policy must allow this site's origin.
    const BUILD_NAME = 'WebGL-Teacher';
    const BUILD_URL = 'https://pub-c0126aea43254adf923bbc903bfd3946.r2.dev/teacher';
    // File extension appended by Unity's compression setting: '', '.gz', '.br', or '.unityweb'.
    const BUILD_EXT = '.unityweb';

    const shell = document.getElementById('gameShell');
    const canvas = document.getElementById('unity-canvas');
    const placeholder = document.getElementById('gamePlaceholder');
    const loading = document.getElementById('gameLoading');
    const progressFill = document.getElementById('progressFill');
    let unityInstance = null;

    // Anonymous load-time and error counters for the admin page (no user info is sent).
    // Wrapped so a blocked or failed request can never affect the game.
    const loadStartedAt = performance.now();
    let clientEventsSent = 0;
    function logClientEvent(data) {
      try {
        if (clientEventsSent++ >= 20) return;
        fetch('https://us-central1-don-t-be-late-e3d9b.cloudfunctions.net/logClientEvent', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ data: Object.assign({ app: 'teacher' }, data) }),
          keepalive: true,
        }).catch(() => {});
      } catch (e) {}
    }
    window.addEventListener('error', (e) => logClientEvent({ type: 'exception', message: String(e.message || e.error || 'error') }));
    window.addEventListener('unhandledrejection', (e) => logClientEvent({ type: 'exception', message: String((e.reason && e.reason.message) || e.reason || 'unhandled rejection') }));

    if (BUILD_NAME) {
      placeholder.style.display = 'none';
      loading.classList.add('show');

      const script = document.createElement('script');
      script.src = `${BUILD_URL}/${BUILD_NAME}.loader.js`;
      script.onload = () => {
        createUnityInstance(canvas, {
          dataUrl: `${BUILD_URL}/${BUILD_NAME}.data${BUILD_EXT}`,
          frameworkUrl: `${BUILD_URL}/${BUILD_NAME}.framework.js${BUILD_EXT}`,
          codeUrl: `${BUILD_URL}/${BUILD_NAME}.wasm${BUILD_EXT}`,
          streamingAssetsUrl: 'StreamingAssets',
          companyName: 'KonitaGames',
          productName: 'dont-be-late',
          productVersion: '0.1.2',
        }, (progress) => {
          progressFill.style.width = (progress * 100) + '%';
        }).then((instance) => {
          unityInstance = instance;
          loading.classList.remove('show');
          logClientEvent({ type: 'game_loaded', seconds: Math.round((performance.now() - loadStartedAt) / 100) / 10 });
        }).catch((err) => {
          logClientEvent({ type: 'game_load_failed', message: String((err && err.message) || err) });
          loading.querySelector('.ph-sub').textContent = 'Something went wrong loading the game. Please refresh and try again.';
          console.error(err);
        });
      };
      script.onerror = () => logClientEvent({ type: 'game_load_failed', message: 'loader script could not download' });
      document.body.appendChild(script);
    }
  </script>

</body>
</html>
